app = 'aixio'
primary_region = 'sin'

[build]
  [build.args]
    # Compile Redis cache support; runtime falls back to in-memory if no DSN is set.
    ENABLE_REDIS = "true"
    # Embed the React web UI into the binary
    ENABLE_EMBEDUI = "true"
    # Match the full runtime profile with Python, Node, and bundled skill deps pre-installed.
    ENABLE_FULL_SKILLS = "true"

# Non-sensitive environment variables.
# Sensitive values (DSNs, tokens, keys) are set via: flyctl secrets set ...
[env]
  # Persist config edits made via the dashboard/API on the mounted data volume.
  GOCLAW_CONFIG = "/app/data/config.json"
  # Allow connections from the fly.io domain and any custom domain you add.
  # Separate multiple origins with commas, or set "*" to allow all.
  GOCLAW_ALLOWED_ORIGINS = "https://aixio.fly.dev"
  # Persist user-installed global skills on the mounted data volume.
  GOCLAW_SKILLS_DIR = "/app/data/skills"
  # Workspace is stored inside the single data volume to avoid needing two mounts.
  GOCLAW_WORKSPACE = "/app/data/workspace"

[http_service]
  internal_port = 18790
  force_https = true
  # Keep at least 1 machine running so cron jobs, channel webhooks (Telegram,
  # Discord, etc.) and heartbeat tasks are always active.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "15s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  # Increase memory/CPUs as needed. 1 GB is sufficient for a lightly-loaded gateway.
  memory = "768mb"
  cpu_kind = "shared"
  cpus = 1

# Single persistent volume for all data: config, runtime packages, agent workspace, etc.
[[mounts]]
  source = "goclaw_data"
  destination = "/app/data"
  initial_size = "2gb"
